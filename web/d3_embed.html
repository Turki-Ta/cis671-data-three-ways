<!doctype html>
<!--
  d3_embed.html: Visualization 2 on its own. The same chart component and the
  same controls as index.html, with no page chrome, for iframes and screenshots.

  URL parameters set the first state, for example
      d3_embed.html?year=2007&x=log&overlay=1&context=1&only=United%20Kingdom,China

  data-fit-viewport lets the plot give up height so the page fits a frame of
  fixed height without a second scrollbar. Everything loads from this folder:
  no CDN, no web font, no network request.
-->
